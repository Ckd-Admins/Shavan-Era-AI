<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Page</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f4f7f6; margin: 0; }
        .container { background: #fff; padding: 30px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); width: 350px; }
        h2 { text-align: center; color: #333; margin-bottom: 25px; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #666; font-size: 0.9rem; }
        input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        input:focus { border-color: #5cb85c; outline: none; }
        button { width: 100%; padding: 12px; background-color: #5cb85c; border: none; border-radius: 5px; color: white; font-size: 1.1rem; cursor: pointer; transition: background-color 0.3s; }
        button:hover { background-color: #4cae4c; }
        .error { color: #d9534f; font-size: 0.85rem; margin-top: 5px; display: none; text-align:center;}
    </style>
</head>
<body>
    <div class="container">
        <h2>Register</h2>
        <form id="registerForm">
            <div class="input-group">
                <label for="rollNumber">Roll Number</label>
                <input type="text" id="rollNumber" name="rollNumber">
            </div>
            <div class="input-group">
                <label for="name">Name</label>
                <input type="text" id="name" name="name">
            </div>
            <div class="input-group">
                <label for="dob">Date of Birth</label>
                <input type="date" id="dob" name="dob">
            </div>
            <div class="input-group">
                <label for="department">Department</label>
                <input type="text" id="department" name="department">
            </div>
            <div class="input-group">
                <label for="email">Email ID</label>
                <input type="email" id="email" name="email">
            </div>
            <button type="submit">Login</button>
            <div id="error-message" class="error">All fields are mandatory!</div>
        </form>
    </div>
    <script>
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const rollNumber = document.getElementById('rollNumber').value.trim();
            const name = document.getElementById('name').value.trim();
            const dob = document.getElementById('dob').value;
            const department = document.getElementById('department').value.trim();
            const email = document.getElementById('email').value.trim();
            const errorMessage = document.getElementById('error-message');

            if (!rollNumber || !name || !dob || !department || !email) {
                errorMessage.style.display = 'block';
            } else {
                errorMessage.style.display = 'none';
                // Success: Redirect to index.html
                window.location.href = 'index.html';
            }
        });
    </script>
</body>
</html>
