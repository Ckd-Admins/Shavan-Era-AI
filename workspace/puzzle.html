<!DOCTYPE html>
<html>
<head>
    <title>Simple Puzzle Game</title>
    <style>
        body { font-family: sans-serif; text-align: center; background-color: #f0f0f0; }
        #game-container { margin: 50px auto; width: 300px; padding: 20px; background: #fff; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        input { padding: 10px; width: 80%; margin-bottom: 10px; }
        button { padding: 10px 20px; cursor: pointer; background-color: #007bff; color: #fff; border: none; border-radius: 4px; }
        #message { margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>
    <div id="game-container">
        <h1>Puzzle Game</h1>
        <p>Guess the number between 1 and 10:</p>
        <input type="number" id="guessInput" min="1" max="10">
        <button onclick="checkGuess()">Guess</button>
        <p id="message"></p>
    </div>
    <script>
        const secretNumber = Math.floor(Math.random() * 10) + 1;
        function checkGuess() {
            const guess = document.getElementById('guessInput').value;
            const message = document.getElementById('message');
            if (guess == secretNumber) {
                message.textContent = 'Congratulations! You guessed it!';
                message.style.color = 'green';
            } else {
                message.textContent = 'Try again!';
                message.style.color = 'red';
            }
        }
    </script>
</body>
</html>
